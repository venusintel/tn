<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <title>Training Note</title>
        <style>
            body{
                font-family: Sans-Serif;
                margin: 0;
            }
            .container{
                display: flex;
                justify-content: space-around;
            }
            .kat-vr-container{
                position: relative;
                display: flex;
                justify-content: center;
                width: 50%;
            }
            .tony-space-container{
                position: relative;
                display: flex;
                justify-content: center;
                width: 50%;
            }
            .kat-vr-container:hover .kat-vr-overlay{
                width: 100%;
                left: 0;
                cursor: pointer;
            }
            .kat-vr-overlay{
                position: absolute;
                opacity: 0.5;
                bottom: 0;
                left: 100%;
                right: 0;
                background-color: #103ea2;
                overflow: hidden;
                width: 0;
                height: 100%;
                transition: all 0.5s ease;
            }
            .tony-space-container:hover .tony-space-overlay{
                width: 100%;
                left: 0;
                cursor: pointer;
            }
            .tony-space-overlay{
                position: absolute;
                opacity: 0.5;
                bottom: 0;
                left: 100%;
                right: 0;
                background-color: #c62626;
                overflow: hidden;
                width: 0;
                height: 100%;
                transition: all 0.5s ease;
            }
            .text{
                color: white;
                font-size: 7vw;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                white-space: nowrap;
            }
            .header{
                background: linear-gradient(90deg, #103ea2 0%, #d41111 100%);
                width: 100%;
                font-size: 4vw;
                color: white;
                display: flex;
                justify-content: center;
                position: sticky;
                top: 0;
                z-index: 1;
            }
            p{
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <img src="venus.png" alt="" height="100vw">
            <!-- <p>Training Content</p> -->
        </div>
        <div class="container">
            <div class="kat-vr-container">
                <img class="kat-vr" src="kat-vr.png" alt="" width="80%">
                <div class="kat-vr-overlay" id="kat-vr">
                    <div class="text">KAT VR</div>
                </div>
            </div>
            <div class="tony-space-container">
                <img class="tony-space" src="tony-space.png" alt="" width="80%">
                <div class="tony-space-overlay" id="tony-space">
                    <div class="text">TONY SPACE</div>
                </div>
            </div>
        </div>

        <script>
            let katvr = document.querySelector("#kat-vr");
            let tonyspace = document.querySelector("#tony-space");
            katvr.addEventListener('click', () => {
                location.href = "https://training.vsmqtt.space/kat-vr.html";
            })
            tonyspace.addEventListener('click', () => {
                location.href = "https://training.vsmqtt.space/tony-space.html";
            })
        </script>
    </body>
</html>
